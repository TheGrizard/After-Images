# After Images: a generative synth for the M-VAVE FM-1 (tools/build.py)
# Build: ./build.sh (from the repository's root; it runs base/tools/build.py app with the Terminus pixel font)
name = "AFTER-IMAGES"
title = "After Images"
id_prefix = "FM-1_78"          # package identity: dev FM-1_7800, releases FM-1_78XXYYZZ
usb_manufacturer = "After Images"
usb_product = "After Images FM-1"
o2 = ["dsp/voice.c", "dsp/seq.c", "dsp/fx.c", "dsp/music.c", "dsp/engine.c", "dsp/piece.c"]   # the sound engine, at -O2
words = "words.tsv"
gen = ["tools/gen_font_dejavu.py {gen}/felucca_font.h"]   # the screen's font: DejaVu Sans (app/fonts), over fm1-base's
ble = true                     # Bluetooth MIDI (BLUETOOTH, ARP four times; off until turned on): clock and notes out,
ble_stack = "own"              # and in, to another FM-1, a phone or a computer. The own stack: ~10 KB of RAM
ble_diag = false               # (the link layer's counters left out: 2.4 KB of RAM)
usb_audio_channels = 2         # one stereo pair: the mix, or (OUTPUT CLEAN) the mix without effects (10, with stems, glitched)
usb_audio_out = false          # the computer's audio never played through the FM-1 (its ring's 8 KB of RAM kept)
cpu2 = true                    # the second core renders some of the layers (app_render)
cpu2_fallback = true           # if it fails, carry on with one core instead of restarting
cpu2_stack = 8192
audio_ahead = true             # a block rendered ahead: one busy moment (a pile of notes starting at once) rides through
                               # instead of dropping; two in a row still drop. 2 KB of RAM, 5.8 ms more latency
                               # (a followed clock allows for it: app.c AUDIO_AHEAD_BEATS)
# the site and firmware.json
tagline = "a generative synth: four layers, one button, endless pieces"
licence = "MPL-2.0"
credits = "Built on fm1-base by Charles Vestal and felucca-bsp by Leo Kuroshita."
author = "TheGrizard"
repo = "https://github.com/TheGrizard/After-Images"
install = "https://github.com/TheGrizard/After-Images/releases/latest"
screenshot = "docs/screen.png"
description = "After Images makes endless ambient pieces: four layers (GROUND, BODY, LIGHT, DUST), each a generative sequencer (eleven, from Euclidean and Markov to Lorenz and Conway's Life) driving one of thirty sound engines in its own part of the spectrum. Press REC for a new piece, following on from the last round the circle of fifths, in one of four personalities: the original ANALYST, dark and droning SENTINEL, ethereal DIPLOMAT or analogue, arpeggiating EXPLORER. Shimmer, reverse echo, chorus and tape, three visuals, MIDI over USB or Bluetooth, and USB audio to the computer, with or without effects."
tags = ["ambient", "generative", "synth"]
